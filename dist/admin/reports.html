<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reports - HomeKeep</title>
  <link rel="stylesheet" crossorigin href="/assets/admin-DjybFkhS.css">
</head>
<body data-area="admin">
<div class="app">
  <aside id="sidebar"></aside>
  <main class="content">
    <div class="topbar"><span>HomeKeep Admin</span></div>

    <div id="repError" class="api-error-banner" role="alert"></div>

    <div class="page-head">
      <div>
        <div class="eyebrow">Reports</div>
        <h2>Reports</h2>
        <p class="muted">Loss ratio recalibrates pricing. Nothing else in the system is allowed to change a price.</p>
      </div>
      <button class="btn ghost" id="exportBtn">Export CSV</button>
    </div>

    <div class="pill-tabs" id="reportTabs" style="margin-bottom:18px">
      <button class="active" data-report="funnel">Conversion funnel</button>
      <button data-report="loss-ratio">Loss ratio</button>
      <button data-report="service">Service performance</button>
      <button data-report="coverage" disabled title="No endpoint given yet">Household coverage</button>
      <button data-report="billing" disabled title="No endpoint given yet">Lead billing</button>
    </div>

    <div id="reportBody"></div>

  </main>
</div>

<script src="../shared/js/config.js"></script>
<script src="../shared/js/api.js"></script>
<script>

  renderSidebar("reports");

  const REPORTS = {
    "funnel": { path: "/v1/admin/reports/funnel", label: "Conversion funnel" },
    "loss-ratio": { path: "/v1/admin/reports/loss-ratio", label: "Loss ratio" },
    "service": { path: "/v1/admin/reports/service", label: "Service performance" }
  };

  let currentReport = "funnel";
  let currentRows = [];

  function fieldFirst(obj, keys, fallback) {
    for (const k of keys) {
      if (obj && obj[k] !== undefined && obj[k] !== null && obj[k] !== "") return obj[k];
    }
    return fallback;
  }

  function humanLabel(key) {
    return key.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
  }

  function autoTable(rows) {
    if (!rows.length) {
      return '<div class="empty-state"><h3>No data</h3><p>This report has nothing to show for the current period.</p></div>';
    }
    const keys = Object.keys(rows[0]).filter(k => typeof rows[0][k] !== "object");
    const thead = keys.map(k => `<th>${escapeHtml(humanLabel(k))}</th>`).join("");
    const tbody = rows.map(r => "<tr>" + keys.map(k => {
      let v = r[k];
      if (typeof v === "number" && /price|premium|claims_paid|cost|amount|billed/.test(k)) v = "\u20aa" + v.toLocaleString();
      return `<td>${escapeHtml(v)}</td>`;
    }).join("") + "</tr>").join("");

    return `
      <div class="table-card">
        <table class="data-table">
          <thead><tr>${thead}</tr></thead>
          <tbody>${tbody}</tbody>
        </table>
      </div>`;
  }

  async function loadReport(key) {
    currentReport = key;
    hideBanner("repError");
    const body = document.getElementById("reportBody");
    body.innerHTML = '<div class="skeleton-line" style="width:100%;height:200px"></div>';

    const def = REPORTS[key];
    if (!def) {
      body.innerHTML = `
        <div class="card" style="padding:22px;border-left:3px solid var(--accent)">
          <div class="section-title">Needs an API</div>
          <p style="font-size:13.5px;line-height:1.6;color:var(--text-2)">
            The spec (\u00a79.3) requires this report but \u00a77.4 doesn't list an endpoint for it yet.
            Give me a <code>GET /v1/admin/reports/...</code> for it and it wires up the same way the
            three tabs to the left do.
          </p>
        </div>`;
      return;
    }

    try {
      const data = await authFetch(def.path, { method: "GET" });
      const rows = Array.isArray(data) ? data : (data.rows || data.items || data.data || []);
      currentRows = rows;
      body.innerHTML = autoTable(rows);
    } catch (error) {
      console.error("Report load error:", error);
      showBanner("repError", error.message || "Unable to load this report.");
      body.innerHTML = "";
    }
  }

  document.querySelectorAll("#reportTabs button").forEach(btn => {
    btn.addEventListener("click", () => {
      if (btn.disabled) return;
      document.querySelectorAll("#reportTabs button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      loadReport(btn.dataset.report);
    });
  });

  document.getElementById("exportBtn").addEventListener("click", () => {
    if (!currentRows.length) { toast("Nothing to export yet.", "err"); return; }
    const keys = Object.keys(currentRows[0]).filter(k => typeof currentRows[0][k] !== "object");
    const csv = [keys.join(",")].concat(
      currentRows.map(r => keys.map(k => JSON.stringify(r[k] ?? "")).join(","))
    ).join("\n");
    const blob = new Blob([csv], { type: "text/csv" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = currentReport + ".csv";
    a.click();
  });

  loadReport("funnel");

</script>
</body>
</html>
