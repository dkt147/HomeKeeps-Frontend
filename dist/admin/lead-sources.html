<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lead sources &amp; pricing - HomeKeep</title>
  <link rel="stylesheet" crossorigin href="/assets/admin-DjybFkhS.css">
</head>
<body data-area="admin">
<div class="app">
  <aside id="sidebar"></aside>
  <main class="content">
    <div class="topbar"><span>HomeKeep Admin</span></div>
    <div id="pageError" class="api-error-banner" role="alert"></div>
    <div class="page-head">
      <div>
        <div class="eyebrow" id="pageEyebrow"></div>
        <h2 id="pageTitle"></h2>
        <p class="muted" id="pageSubtitle"></p>
      </div>
      <button class="btn accent" id="newBtn"></button>
    </div>

    <div class="card" id="formPanel" style="display:none;padding:22px;margin-bottom:20px">
      <div class="section-title" id="formTitle"></div>
      <div id="formFields"></div>
      <div style="display:flex;gap:10px">
        <button class="btn primary" id="saveFormBtn">Save</button>
        <button class="btn ghost" id="cancelFormBtn">Cancel</button>
      </div>
    </div>

    <div class="table-card">
      <div class="table-toolbar"><div class="muted mini" id="rowCount"></div></div>
      <table class="data-table">
        <thead><tr id="theadRow"></tr></thead>
        <tbody id="rows"><tr><td colspan="8"><div class="skeleton-line" style="width:100%"></div></td></tr></tbody>
      </table>
      <div id="emptyState" class="empty-state" style="display:none"><h3>Nothing here yet</h3><p>Create the first one above.</p></div>
    </div>

  </main>
</div>
<script src="../shared/js/config.js"></script>
<script src="../shared/js/api.js"></script>
<script src="../shared/js/admin-crud.js"></script>
<script>

renderCrudPage({
  navKey: "lead-sources",
  eyebrow: "Data \u00b7 lead_sources",
  title: "Lead sources & pricing",
  subtitle: "What we owe each supplier, and when a lead counts as billable.",
  listPath: "/v1/admin/lead-sources",
  createLabel: "+ New source",
  toggleField: "active",
  columns: [
    { label: "Name", render: s => `<span class="cell-primary">${escapeHtml(fieldFirst(s,["name"],"\u2014"))}</span>` },
    { label: "Integration", render: s => escapeHtml(fieldFirst(s,["integration_type"],"\u2014")) },
    { label: "Pricing model", render: s => `<span class="badge b-accent">${escapeHtml(fieldFirst(s,["pricing_model"],"\u2014"))}</span>` },
    { label: "Price / lead", render: s => s.price_per_lead != null ? "\u20aa" + (s.price_per_lead/100).toLocaleString() : "\u2014" },
    { label: "Price / activation", render: s => s.price_per_activation != null ? "\u20aa" + (s.price_per_activation/100).toLocaleString() : "\u2014" },
    { label: "Price / warranty", render: s => s.price_per_warranty != null ? "\u20aa" + (s.price_per_warranty/100).toLocaleString() : "\u2014" },
    { label: "Attribution window", render: s => (fieldFirst(s,["attribution_window_days"],"\u2014")) + " d" }
  ],
  fields: [
    { key: "name", label: "Name", type: "text", placeholder: "Electra Home" },
    { key: "integration_type", label: "Integration type", type: "text", placeholder: "webhook" },
    { key: "pricing_model", label: "Pricing model", type: "select", options: [
        {value:"per_lead",label:"per_lead"},{value:"per_closed_lead",label:"per_closed_lead"},{value:"hybrid",label:"hybrid"}] },
    { key: "price_per_lead", label: "Price per lead (agorot)", type: "number" },
    { key: "price_per_activation", label: "Price per activation (agorot)", type: "number" },
    { key: "price_per_warranty", label: "Price per warranty sold (agorot)", type: "number" },
    { key: "closed_definition", label: "Closed lead definition", type: "text", placeholder: "extended warranty sold" },
    { key: "attribution_window_days", label: "Attribution window (days)", type: "number", placeholder: "540" },
    { key: "active", label: "Active", type: "checkbox", default: true }
  ]
});

</script>
</body>
</html>
