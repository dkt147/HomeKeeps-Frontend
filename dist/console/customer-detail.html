<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Customer 360 - HomeKeep</title>
  <style>
    .c360-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 18px; align-items: start; margin-top: 18px; }
    @media (max-width: 1100px) { .c360-grid { grid-template-columns: 1fr; } }
    .interaction-item { padding: 10px 0; border-bottom: 1px solid var(--border-soft); font-size: 13px; }
    .interaction-item:last-child { border-bottom: none; }
  </style>
  <link rel="stylesheet" crossorigin href="/assets/admin-DjybFkhS.css">
</head>

<body data-area="console">

<div class="app">

  <aside id="sidebar"></aside>

  <main class="content">

    <div class="topbar">
      <a href="customers.html" class="btn ghost small">&larr; Back to search</a>
    </div>

    <div id="custError" class="api-error-banner" role="alert"></div>

    <div id="custBody" style="display:none">

      <div class="page-head">
        <div>
          <div class="eyebrow">Customer 360</div>
          <h2 id="custName">&mdash;</h2>
          <p class="muted" id="custMeta"></p>
        </div>
      </div>

      <div class="stats">
        <div class="stat stat-card"><span class="stat-label"><span class="dot"></span>Products</span><span id="statProducts" class="stat-value">&mdash;</span></div>
        <div class="stat stat-card"><span class="stat-label"><span class="dot"></span>Covered</span><span id="statCovered" class="stat-value">&mdash;</span></div>
        <div class="stat stat-card alert"><span class="stat-label"><span class="dot"></span>Open cases</span><span id="statOpenCases" class="stat-value">&mdash;</span></div>
        <div class="stat stat-card"><span class="stat-label"><span class="dot"></span>Lifetime premium</span><span id="statPremium" class="stat-value">&mdash;</span></div>
      </div>

      <div class="c360-grid">

        <div style="display:flex;flex-direction:column;gap:16px">

          <div class="table-card">
            <div class="table-toolbar"><div class="section-title" style="margin:0">Products</div></div>
            <table class="data-table">
              <thead>
                <tr><th>Product</th><th>Serial</th><th>Status</th><th>Coverage</th><th>Health</th><th></th></tr>
              </thead>
              <tbody id="productsRows"></tbody>
            </table>
          </div>

          <div class="card" style="padding:20px">
            <div class="section-title">Interactions</div>
            <div id="interactionsList"></div>
            <div class="divider"></div>
            <div class="form-row">
              <label>Channel
                <select id="interactionChannel">
                  <option value="phone">phone</option>
                  <option value="whatsapp">whatsapp</option>
                  <option value="email">email</option>
                  <option value="in_app">in_app</option>
                </select>
              </label>
              <label>Direction
                <select id="interactionDirection">
                  <option value="outbound">outbound</option>
                  <option value="inbound">inbound</option>
                </select>
              </label>
            </div>
            <label>Notes
              <textarea id="interactionNotes" rows="2" placeholder="What happened on this contact?"></textarea>
            </label>
            <button class="btn ghost" id="logInteractionBtn">Log interaction</button>
          </div>

        </div>

        <div style="display:flex;flex-direction:column;gap:16px">

          <div class="hero-card" id="nbaCard">
            <div class="eyebrow">Next best action</div>
            <h3 id="nbaTitle">Loading&hellip;</h3>
            <p id="nbaBody"></p>
            <button class="btn full" style="margin-top:14px;background:#fff;color:var(--indigo-800)" id="nbaAction">View</button>
          </div>

          <div class="card" style="padding:20px">
            <div class="section-title">Contact</div>
            <div id="contactBlock"></div>
          </div>

        </div>

      </div>
    </div>

  </main>
</div>

<script src="../shared/js/config.js"></script>
<script src="../shared/js/api.js"></script>
<script>

  renderSidebar("customers");

  const customerId = qs("id");
  if (!customerId) showBanner("custError", "No customer id was given. Go back and open a customer from search.");

  function fieldFirst(obj, keys, fallback) {
    for (const k of keys) {
      if (obj && obj[k] !== undefined && obj[k] !== null && obj[k] !== "") return obj[k];
    }
    return fallback;
  }

  function kv(k, v) {
    return `<div class="kv-row" style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:13.5px"><span class="muted">${escapeHtml(k)}</span><span style="font-weight:600;text-align:right">${v}</span></div>`;
  }

  function productRow(p) {
    const pid = fieldFirst(p, ["id", "product_id"], "");
    const name = fieldFirst(p, ["name", "product_name"], "&mdash;");
    const serial = fieldFirst(p, ["serial", "serial_number"], "&mdash;");
    const status = fieldFirst(p, ["status"], "&mdash;");
    const coverageUntil = fieldFirst(p, ["coverage_until", "warranty_end"], null);
    const health = fieldFirst(p, ["health_score"], null);
    const covered = status === "active" || !!coverageUntil;

    return `
      <tr>
        <td class="cell-primary">${escapeHtml(name)}</td>
        <td class="cell-sub">${escapeHtml(serial)}</td>
        <td><span class="badge ${statusBadgeClass(status)}">${escapeHtml(status)}</span></td>
        <td>${coverageUntil ? fmtDate(coverageUntil) : '<span class="mini">no coverage</span>'}</td>
        <td>${health !== null ? health : "&mdash;"}</td>
        <td><a class="btn small soft" href="sale.html?customer_id=${encodeURIComponent(customerId)}&product_id=${encodeURIComponent(pid)}">Sell warranty</a></td>
      </tr>`;
  }

  function renderCustomer(c) {
    document.getElementById("custName").textContent = fieldFirst(c, ["name", "full_name"], "Customer");
    document.getElementById("custMeta").textContent =
      [fieldFirst(c, ["phone"], ""), fieldFirst(c, ["email"], ""), fieldFirst(c, ["address"], (c.address && c.address.line1) || "")]
        .filter(Boolean).join(" · ");

    document.getElementById("statProducts").textContent = fieldFirst(c, ["product_count", "products_count"], (c.products || []).length);
    document.getElementById("statCovered").textContent = fieldFirst(c, ["covered_count"], "&mdash;");
    document.getElementById("statOpenCases").textContent = fieldFirst(c, ["open_cases", "open_case_count"], "0");
    document.getElementById("statPremium").textContent = fieldFirst(c, ["lifetime_premium"], null) !== null
      ? "\u20aa" + fieldFirst(c, ["lifetime_premium"], 0) : "&mdash;";

    const products = c.products || c.appliances || [];
    document.getElementById("productsRows").innerHTML = products.length
      ? products.map(productRow).join("")
      : '<tr><td colspan="6" class="muted mini" style="padding:20px">No products on file yet.</td></tr>';

    const interactions = c.interactions || c.recent_interactions || [];
    document.getElementById("interactionsList").innerHTML = interactions.length
      ? interactions.map(i => `<div class="interaction-item">${escapeHtml(i.channel || "")} · ${escapeHtml(i.direction || "")} &mdash; ${escapeHtml((i.payload && i.payload.notes) || i.notes || "")}<div class="mini">${i.created_at ? fmtDateTime(i.created_at) : ""}</div></div>`).join("")
      : '<p class="muted mini">No interactions logged yet.</p>';

    document.getElementById("contactBlock").innerHTML =
      kv("Phone", escapeHtml(fieldFirst(c, ["phone"], "&mdash;"))) +
      kv("Email", escapeHtml(fieldFirst(c, ["email"], "&mdash;"))) +
      kv("Customer since", fmtDate(fieldFirst(c, ["created_at", "customer_since"], null)));

    document.getElementById("custBody").style.display = "block";
  }

  async function loadCustomer() {
    if (!customerId) return;
    hideBanner("custError");
    try {
      const data = await authFetch("/v1/console/customers/" + encodeURIComponent(customerId), { method: "GET" });
      renderCustomer(data);
    } catch (error) {
      console.error("Customer load error:", error);
      showBanner("custError", error.message || "Unable to load this customer.");
    }
  }

  async function loadNextBestAction() {
    if (!customerId) return;
    try {
      const data = await authFetch("/v1/console/next-best-action?customer_id=" + encodeURIComponent(customerId), { method: "GET" });
      const title = fieldFirst(data, ["title", "reason", "type"], "Nothing to offer right now");
      document.getElementById("nbaTitle").textContent = title;
      document.getElementById("nbaBody").textContent = fieldFirst(data, ["description", "detail"], "This updates automatically as coverage and case state change.");
      const productId = fieldFirst(data, ["product_id"], "");
      const nbaBtn = document.getElementById("nbaAction");
      if (productId) {
        nbaBtn.style.display = "inline-flex";
        nbaBtn.onclick = () => { window.location.href = "sale.html?customer_id=" + encodeURIComponent(customerId) + "&product_id=" + encodeURIComponent(productId); };
      } else {
        nbaBtn.style.display = "none";
      }
    } catch (error) {
      document.getElementById("nbaTitle").textContent = "No offer available";
      document.getElementById("nbaBody").textContent = error.message || "The next-best-action engine has nothing to show for this customer right now.";
      document.getElementById("nbaAction").style.display = "none";
    }
  }

  document.getElementById("logInteractionBtn").addEventListener("click", async () => {
    const channel = document.getElementById("interactionChannel").value;
    const direction = document.getElementById("interactionDirection").value;
    const notes = document.getElementById("interactionNotes").value.trim();

    try {
      await authFetch("/v1/console/customers/" + encodeURIComponent(customerId) + "/interactions", {
        method: "POST",
        body: { channel, direction, status: "completed", payload: { notes } }
      });
      document.getElementById("interactionNotes").value = "";
      toast("Interaction logged.");
      loadCustomer();
    } catch (error) {
      toast(error.message || "Could not log the interaction.", "err");
    }
  });

  loadCustomer();
  loadNextBestAction();

</script>

</body>
</html>
