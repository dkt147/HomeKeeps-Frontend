<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Outbound message log - HomeKeep</title><link rel="stylesheet" href="../shared/css/admin.css"></head>
<body data-area="admin"><div class="app"><aside id="sidebar"></aside><main class="content">
<div id="pageError" class="api-error-banner" role="alert"></div>
<div class="page-head"><div><div class="eyebrow">Communication</div><h2>Outbound message log</h2><p class="muted">Interactions recorded before dispatch and updated by delivery events.</p></div></div>
<div class="card" style="padding:16px;margin-bottom:16px"><div class="form-row"><label>Channel<select id="channel"><option value="">All</option><option>whatsapp</option><option>sms</option><option>push</option><option>phone</option></select></label><label>Status<select id="status"><option value="">All</option><option>queued</option><option>sent</option><option>delivered</option><option>read</option><option>failed</option><option>completed</option></select></label><label>Direction<select id="direction"><option value="">All</option><option>outbound</option><option>inbound</option></select></label><label>Customer ID<input id="customerId"></label><label style="align-self:end"><button class="btn primary" id="apply">Filter</button></label></div></div>
<div class="table-card"><table class="data-table"><thead><tr><th>Time</th><th>Customer</th><th>Channel</th><th>Direction</th><th>Template</th><th>Status</th><th>Provider message</th></tr></thead><tbody id="rows"></tbody></table></div>
</main></div>
<script src="../shared/js/config.js"></script><script src="../shared/js/api.js"></script><script>
renderSidebar("message-log");const $=id=>document.getElementById(id);
async function load(){hideBanner("pageError");const p=new URLSearchParams({page:"1",per_page:"100"});["channel","status","direction"].forEach(k=>{if($(k).value)p.set(k,$(k).value)});if($("customerId").value.trim())p.set("customer_id",$("customerId").value.trim());try{let d=await authFetch("/v1/admin/interactions?"+p,{method:"GET"});let items=Array.isArray(d)?d:(d.items||d.data||[]);$("rows").innerHTML=items.map(i=>{const c=i.customer||{};return `<tr><td class="cell-sub">${escapeHtml(fmtDateTime(i.created_at))}</td><td><div class="cell-primary">${escapeHtml(c.full_name||"—")}</div><div class="cell-sub">${escapeHtml(c.phone||i.customer_id||"")}</div></td><td>${escapeHtml(i.channel||"—")}</td><td>${escapeHtml(i.direction||"—")}</td><td>${escapeHtml(i.template_id||"—")}</td><td><span class="badge ${statusBadgeClass(i.status)}">${escapeHtml(i.status||"—")}</span></td><td class="cell-sub">${escapeHtml(i.provider_message_id||"—")}</td></tr>`}).join("")||'<tr><td colspan="7"><div class="empty-state"><h3>No interactions</h3></div></td></tr>'}catch(e){showBanner("pageError",e.message||"Unable to load interactions.")}}$("apply").onclick=load;load();
</script></body></html>
