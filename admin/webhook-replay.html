<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Webhook replay - HomeKeep</title><link rel="stylesheet" href="../shared/css/admin.css"></head>
<body data-area="admin"><div class="app"><aside id="sidebar"></aside><main class="content">
<div id="pageError" class="api-error-banner" role="alert"></div>
<div class="page-head"><div><div class="eyebrow">Data · webhook replay</div><h2>Webhook replay</h2><p class="muted">Review failed webhook deliveries and replay supported payloads.</p></div><button class="btn ghost" id="refreshBtn">Refresh</button></div>
<div class="table-card"><table class="data-table"><thead><tr><th>Received</th><th>Type</th><th>External ID</th><th>Status</th><th>Attempts</th><th>Last error</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
</main></div>
<script src="../shared/js/config.js"></script><script src="../shared/js/api.js"></script><script>
renderSidebar("webhook-replay");const $=id=>document.getElementById(id);
async function load(){hideBanner("pageError");try{let d=await authFetch("/v1/admin/webhook-replay",{method:"GET"});let items=Array.isArray(d)?d:(d.items||d.data||[]);$("rows").innerHTML=items.map(x=>`<tr><td class="cell-sub">${escapeHtml(fmtDateTime(x.created_at))}</td><td>${escapeHtml(x.type||"—")}</td><td class="cell-sub">${escapeHtml(x.external_id||"—")}</td><td><span class="badge ${statusBadgeClass(x.status)}">${escapeHtml(x.status||"—")}</span></td><td>${escapeHtml(x.attempts??0)}</td><td class="cell-sub">${escapeHtml(x.last_error||"—")}</td><td>${x.status!=="completed"?`<button class="btn ghost small" data-replay="${escapeHtml(x._id||x.id)}">Replay</button>`:""}</td></tr>`).join("")||'<tr><td colspan="7"><div class="empty-state"><h3>No webhook failures</h3></div></td></tr>';document.querySelectorAll("[data-replay]").forEach(b=>b.onclick=async()=>{b.disabled=true;b.textContent="Replaying…";try{await authFetch("/v1/admin/webhook-replay/"+encodeURIComponent(b.dataset.replay)+"/replay",{method:"POST"});toast("Replay processed.");load()}catch(e){toast(e.message,"err");b.disabled=false;b.textContent="Replay"}})}catch(e){showBanner("pageError",e.message||"Unable to load webhook queue.")}}$("refreshBtn").onclick=load;load();
</script></body></html>
