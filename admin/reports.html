<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports - HomeKeep</title><link rel="stylesheet" href="../shared/css/admin.css"></head>
<body data-area="admin"><div class="app"><aside id="sidebar"></aside><main class="content">
<div id="repError" class="api-error-banner" role="alert"></div>
<div class="page-head"><div><div class="eyebrow">Reports</div><h2>Reports</h2><p class="muted">Phase 1 operational and commercial reporting.</p></div><button class="btn ghost" id="exportBtn">Export CSV</button></div>
<div class="pill-tabs" id="reportTabs" style="margin-bottom:18px">
<button class="active" data-report="funnel">Conversion funnel</button><button data-report="loss-ratio">Loss ratio</button><button data-report="service">Service performance</button><button data-report="coverage">Household coverage</button><button data-report="billing">Lead billing</button>
</div>
<div class="card" style="padding:16px;margin-bottom:16px"><div class="form-row"><label>From<input id="from" type="date"></label><label>To<input id="to" type="date"></label><label style="align-self:end"><button class="btn primary" id="applyBtn">Apply</button></label></div></div>
<div id="reportBody"></div>
</main></div>
<script src="../shared/js/config.js"></script><script src="../shared/js/api.js"></script><script>
renderSidebar("reports");
const REPORTS={funnel:{path:"/v1/admin/reports/funnel",label:"Conversion funnel"}, "loss-ratio":{path:"/v1/admin/reports/loss-ratio",label:"Loss ratio"},service:{path:"/v1/admin/reports/service",label:"Service performance"},coverage:{path:"/v1/admin/reports/household-coverage",label:"Household coverage"},billing:{path:"/v1/admin/reports/lead-billing",label:"Lead billing"}};
let current="funnel",rows=[];
function flatten(v){if(v===null||v===undefined)return "";if(Array.isArray(v)||typeof v==="object")return JSON.stringify(v);return v}
function autoTable(data){let list=Array.isArray(data)?data:[data];if(!list.length)return '<div class="empty-state"><h3>No data</h3><p>No records for this period.</p></div>';if(list.length===1&&typeof list[0]!=="object")list=[{value:list[0]}];const keys=[...new Set(list.flatMap(x=>Object.keys(x||{})).filter(k=>typeof (list.find(x=>x?.[k])?.[k])!=="object"))];return `<div class="table-card"><table class="data-table"><thead><tr>${keys.map(k=>`<th>${escapeHtml(k.replaceAll("_"," ").replace(/\\b\\w/g,c=>c.toUpperCase()))}</th>`).join("")}</tr></thead><tbody>${list.map(r=>`<tr>${keys.map(k=>{let v=r?.[k];if(typeof v==="number"&&/price|premium|cost|amount|billed|claims_paid|avg_cost/.test(k))v="₪"+v.toLocaleString();return `<td>${escapeHtml(flatten(v))}</td>`}).join("")}</tr>`).join("")}</tbody></table></div>`}
async function loadReport(){hideBanner("repError");const d=REPORTS[current];const params=new URLSearchParams();if($("from").value)params.set("from",$("from").value);if($("to").value)params.set("to",$("to").value);$("reportBody").innerHTML='<div class="skeleton-line" style="height:180px;width:100%"></div>';try{const data=await authFetch(d.path+(params.toString()?"?"+params:""),{method:"GET"});rows=Array.isArray(data)?data:(data.rows||data.items||data.data||[data]);$("reportBody").innerHTML=autoTable(rows)}catch(e){rows=[];showBanner("repError",e.message||"Unable to load report.");$("reportBody").innerHTML=""}}
document.querySelectorAll("#reportTabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#reportTabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active");current=b.dataset.report;loadReport()});$("applyBtn").onclick=loadReport;
$("exportBtn").onclick=()=>{if(!rows.length){toast("Nothing to export.","err");return}const keys=Object.keys(rows[0]||{}).filter(k=>typeof rows[0][k]!=="object");const csv=[keys.join(","),...rows.map(r=>keys.map(k=>JSON.stringify(r?.[k]??"")).join(","))].join("\\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=current+".csv";a.click();URL.revokeObjectURL(a.href)};loadReport();
</script></body></html>
