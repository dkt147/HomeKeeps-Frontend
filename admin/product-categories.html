<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Categories - HomeKeep</title>
  <link rel="stylesheet" href="../shared/css/admin.css">
</head>

<body data-area="admin">

<div class="app">

  <aside id="sidebar"></aside>

  <main class="content">

    <div class="topbar"><span>HomeKeep Admin</span></div>

    <div id="catError" class="api-error-banner" role="alert"></div>

    <div class="page-head">
      <div>
        <div class="eyebrow">Configuration &middot; product_categories</div>
        <h2>Categories</h2>
        <p class="muted">What may be added to a wallet, and its default lifespan for pricing.</p>
      </div>
      <button class="btn accent" id="newCatBtn">+ New category</button>
    </div>

    <div class="card" id="newCatForm" style="display:none;padding:22px;margin-bottom:20px">
      <div class="section-title">New category</div>
      <div class="form-row">
        <label>Name <input id="catName" type="text" placeholder="Microwave oven"></label>
        <label>Avg. lifespan (months) <input id="catLifespan" type="number" min="0" placeholder="120"></label>
      </div>
      <label style="flex-direction:row;align-items:center;gap:8px">
        <input id="catInsurable" type="checkbox" style="width:auto" checked> Insurable
      </label>
      <label>Fault types <span class="field-hint">comma separated, e.g. not_starting, not_heating, electrical_fault</span>
        <input id="catFaultTypes" type="text" placeholder="not_starting, not_heating, electrical_fault">
      </label>
      <div style="display:flex;gap:10px">
        <button class="btn primary" id="createCatBtn">Create</button>
        <button class="btn ghost" id="cancelCatBtn">Cancel</button>
      </div>
    </div>

    <div class="table-card">
      <div class="table-toolbar"><div class="muted mini" id="rowCount"></div></div>
      <table class="data-table">
        <thead><tr><th>Name</th><th>Avg. lifespan</th><th>Insurable</th><th>Fault types</th><th></th></tr></thead>
        <tbody id="catRows"><tr><td colspan="5"><div class="skeleton-line" style="width:100%"></div></td></tr></tbody>
      </table>
      <div id="catEmpty" class="empty-state" style="display:none"><h3>No categories yet</h3><p>Create the first one above.</p></div>
    </div>

  </main>
</div>

<script src="../shared/js/config.js"></script>
<script src="../shared/js/api.js"></script>
<script>

  renderSidebar("product-categories");

  function fieldFirst(obj, keys, fallback) {
    for (const k of keys) {
      if (obj && obj[k] !== undefined && obj[k] !== null && obj[k] !== "") return obj[k];
    }
    return fallback;
  }

  function rowHtml(c) {
    const id = fieldFirst(c, ["id", "category_id"], "");
    const name = fieldFirst(c, ["name"], "&mdash;");
    const lifespan = fieldFirst(c, ["avg_lifespan_months"], "&mdash;");
    const insurable = c.is_insurable !== false;
    const faults = (c.fault_types || []).join(", ") || "&mdash;";

    return `
      <tr data-id="${escapeHtml(id)}">
        <td class="cell-primary">${escapeHtml(name)}</td>
        <td>${lifespan} mo</td>
        <td><span class="badge ${insurable ? "b-success" : "b-muted"}">${insurable ? "insurable" : "not insurable"}</span></td>
        <td class="cell-sub" style="max-width:320px">${escapeHtml(faults)}</td>
        <td style="display:flex;gap:6px">
          <button class="btn ghost small" data-edit="${escapeHtml(id)}">Edit</button>
          <button class="btn ghost small" data-del="${escapeHtml(id)}" style="color:var(--danger)">Delete</button>
        </td>
      </tr>`;
  }

  async function loadCategories() {
    hideBanner("catError");
    const tbody = document.getElementById("catRows");
    const empty = document.getElementById("catEmpty");
    try {
      const data = await authFetch("/v1/admin/product-categories?page=1&per_page=50", { method: "GET" });
      const items = Array.isArray(data) ? data : (data.items || data.results || data.data || []);
      document.getElementById("rowCount").textContent = items.length + " categor" + (items.length === 1 ? "y" : "ies");

      if (!items.length) {
        tbody.innerHTML = "";
        empty.style.display = "block";
      } else {
        empty.style.display = "none";
        tbody.innerHTML = items.map(rowHtml).join("");

        tbody.querySelectorAll("[data-del]").forEach(btn => {
          btn.addEventListener("click", async () => {
            if (!confirm("Delete this category? This cannot be undone.")) return;
            try {
              await authFetch("/v1/admin/product-categories/" + encodeURIComponent(btn.dataset.del), { method: "DELETE" });
              toast("Category deleted.");
              loadCategories();
            } catch (error) {
              toast(error.message || "Could not delete the category.", "err");
            }
          });
        });

        tbody.querySelectorAll("[data-edit]").forEach(btn => {
          btn.addEventListener("click", () => openEdit(btn.dataset.edit, items));
        });
      }
    } catch (error) {
      console.error("Categories error:", error);
      tbody.innerHTML = "";
      showBanner("catError", error.message || "Unable to load categories.");
    }
  }

  function openEdit(id, items) {
    const item = items.find(i => String(fieldFirst(i, ["id", "category_id"], "")) === String(id));
    if (!item) return;
    const newLifespan = prompt("Avg. lifespan (months) for \u201c" + (item.name || "") + "\u201d:", item.avg_lifespan_months || "");
    if (newLifespan === null) return;
    updateCategory(id, { avg_lifespan_months: Number(newLifespan) });
  }

  async function updateCategory(id, patch) {
    try {
      await authFetch("/v1/admin/product-categories/" + encodeURIComponent(id), { method: "PATCH", body: patch });
      toast("Category updated.");
      loadCategories();
    } catch (error) {
      toast(error.message || "Could not update the category.", "err");
    }
  }

  document.getElementById("newCatBtn").addEventListener("click", () => { document.getElementById("newCatForm").style.display = "block"; });
  document.getElementById("cancelCatBtn").addEventListener("click", () => { document.getElementById("newCatForm").style.display = "none"; });

  document.getElementById("createCatBtn").addEventListener("click", async () => {
    const name = document.getElementById("catName").value.trim();
    const avg_lifespan_months = Number(document.getElementById("catLifespan").value || 0);
    const is_insurable = document.getElementById("catInsurable").checked;
    const fault_types = document.getElementById("catFaultTypes").value.split(",").map(s => s.trim()).filter(Boolean);

    if (!name) { toast("Name is required.", "err"); return; }

    try {
      await authFetch("/v1/admin/product-categories", {
        method: "POST",
        body: { name, avg_lifespan_months, is_insurable, fault_types }
      });
      toast("Category created.");
      document.getElementById("newCatForm").style.display = "none";
      ["catName","catLifespan","catFaultTypes"].forEach(id => document.getElementById(id).value = "");
      loadCategories();
    } catch (error) {
      toast(error.message || "Could not create the category.", "err");
    }
  });

  loadCategories();

</script>

</body>
</html>
