<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Service providers - HomeKeep</title>
  <link rel="stylesheet" href="../shared/css/admin.css">
</head>
<body data-area="admin">
<div class="app">
  <aside id="sidebar"></aside>
  <main class="content">
    <div class="topbar"><span>HomeKeep Admin</span></div>
    <div id="pageError" class="api-error-banner" role="alert"></div>
    <div class="page-head">
      <div>
        <div class="eyebrow" id="pageEyebrow"></div>
        <h2 id="pageTitle"></h2>
        <p class="muted" id="pageSubtitle"></p>
      </div>
      <button class="btn accent" id="newBtn"></button>
    </div>

    <div class="card" id="formPanel" style="display:none;padding:22px;margin-bottom:20px">
      <div class="section-title" id="formTitle"></div>
      <div id="formFields"></div>
      <div style="display:flex;gap:10px">
        <button class="btn primary" id="saveFormBtn">Save</button>
        <button class="btn ghost" id="cancelFormBtn">Cancel</button>
      </div>
    </div>

    <div class="table-card">
      <div class="table-toolbar"><div class="muted mini" id="rowCount"></div></div>
      <table class="data-table">
        <thead><tr id="theadRow"></tr></thead>
        <tbody id="rows"><tr><td colspan="8"><div class="skeleton-line" style="width:100%"></div></td></tr></tbody>
      </table>
      <div id="emptyState" class="empty-state" style="display:none"><h3>Nothing here yet</h3><p>Create the first one above.</p></div>
    </div>

  </main>
</div>
<script src="../shared/js/config.js"></script>
<script src="../shared/js/api.js"></script>
<script src="../shared/js/admin-crud.js"></script>
<script>

renderCrudPage({
  navKey: "service-providers",
  eyebrow: "Configuration \u00b7 service_providers",
  title: "Service providers",
  subtitle: "sla_hours here is what computes sla_due_at at routing time \u2014 changing it affects cases routed from now on, never cases already routed.",
  listPath: "/v1/admin/service-providers",
  createPermission: "service_providers:create",
  updatePermission: "service_providers:update",
  deletePermission: "service_providers:delete",
  createLabel: "+ New provider",
  toggleField: "active",
  columns: [
    { label: "Name", render: p => `<span class="cell-primary">${escapeHtml(fieldFirst(p,["name"],"\u2014"))}</span><div class="cell-sub">${escapeHtml(fieldFirst(p,["phone"],""))} \u00b7 ${escapeHtml(fieldFirst(p,["email"],""))}</div>` },
    { label: "Type", render: p => p.is_internal ? '<span class="badge b-accent">internal network</span>' : '<span class="badge b-muted">manufacturer / referral</span>' },
    { label: "SLA hours", render: p => escapeHtml(fieldFirst(p,["sla_hours"],"n/a")) },
    { label: "Coverage areas", render: p => escapeHtml((p.coverage_areas||[]).join(", ") || "\u2014") }
  ],
  fields: [
    { key: "name", label: "Name", type: "text", placeholder: "Kav Service" },
    { key: "phone", label: "Phone", type: "text", placeholder: "*5544" },
    { key: "email", label: "Email", type: "text", placeholder: "ops@provider.co.il" },
    { key: "is_internal", label: "Internal network provider (dispatched by us)", type: "checkbox" },
    { key: "sla_hours", label: "SLA hours", type: "number", placeholder: "48" },
    { key: "coverage_areas", label: "Coverage areas", type: "list", hint: "comma separated, e.g. Centre, Sharon", placeholder: "Centre, Sharon" },
    { key: "active", label: "Active", type: "checkbox", default: true }
  ]
});

</script>
</body>
</html>
