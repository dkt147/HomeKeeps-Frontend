<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Eligibility rules - HomeKeep</title>
  <link rel="stylesheet" href="../shared/css/admin.css">
</head>
<body data-area="admin">
<div class="app">
  <aside id="sidebar"></aside>
  <main class="content">
    <div class="topbar"><span>HomeKeep Admin</span></div>
    <div id="pageError" class="api-error-banner" role="alert"></div>
    <div class="page-head">
      <div>
        <div class="eyebrow" id="pageEyebrow"></div>
        <h2 id="pageTitle"></h2>
        <p class="muted" id="pageSubtitle"></p>
      </div>
      <button class="btn accent" id="newBtn"></button>
    </div>

    <div class="card" id="formPanel" style="display:none;padding:22px;margin-bottom:20px">
      <div class="section-title" id="formTitle"></div>
      <div id="formFields"></div>
      <div style="display:flex;gap:10px">
        <button class="btn primary" id="saveFormBtn">Save</button>
        <button class="btn ghost" id="cancelFormBtn">Cancel</button>
      </div>
    </div>

    <div class="table-card">
      <div class="table-toolbar"><div class="muted mini" id="rowCount"></div></div>
      <table class="data-table">
        <thead><tr id="theadRow"></tr></thead>
        <tbody id="rows"><tr><td colspan="8"><div class="skeleton-line" style="width:100%"></div></td></tr></tbody>
      </table>
      <div id="emptyState" class="empty-state" style="display:none"><h3>Nothing here yet</h3><p>Create the first one above.</p></div>
    </div>
  </main>
</div>
<script src="../shared/js/config.js"></script>
<script src="../shared/js/api.js"></script>
<script src="../shared/js/admin-crud.js"></script>
<script>

renderCrudPage({
  navKey: "eligibility-rules",
  eyebrow: "Configuration \u00b7 eligibility_rules",
  title: "Eligibility rules",
  subtitle: "What may be offered, to which product, and when. Evaluated top to bottom; the first blocking rule wins and its reason is shown to both the advisor and the app.",
  listPath: "/v1/admin/eligibility-rules",
  createPermission: "eligibility_rules:create",
  updatePermission: "eligibility_rules:update",
  deletePermission: "eligibility_rules:delete",
  createLabel: "+ New rule",
  toggleField: "is_active",
  columns: [
    { label: "#", render: r => escapeHtml(fieldFirst(r,["priority","order"],"\u2014")) },
    { label: "Rule", render: r => `<span class="cell-primary">${escapeHtml(fieldFirst(r,["name","label"],"\u2014"))}</span><div class="cell-sub">${escapeHtml(JSON.stringify(r.conditions || {}))}</div>` },
    { label: "Category", render: r => escapeHtml(fieldFirst(r,["category_id"],"All categories")) },
    { label: "Active", render: r => `<span class="badge ${r.is_active ? "b-success" : "b-muted"}">${r.is_active ? "active" : "inactive"}</span>` }
  ],
  fields: [
    { key: "priority", label: "Priority (ascending)", type: "number", placeholder: "1" },
    { key: "name", label: "Rule name", type: "text", placeholder: "Manufacturer warranty must end within 90 days" },
    { key: "category_id", label: "Category id (optional)", type: "text", placeholder: "Category UUID" },
    { key: "conditions", label: "Conditions (JSON)", type: "textarea", json: true, rows: 5, placeholder: '{ "type": "mw_ends_within_days", "days": 90 }' },
    { key: "is_active", label: "Active", type: "checkbox", default: true }
  ]
});

</script>
</body>
</html>
