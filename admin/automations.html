<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Automations - HomeKeep</title>
  <link rel="stylesheet" href="../shared/css/admin.css">
</head>
<body data-area="admin">
<div class="app">
  <aside id="sidebar"></aside>
  <main class="content">
    <div class="topbar"><span>HomeKeep Admin</span></div>
    <div id="pageError" class="api-error-banner" role="alert"></div>
    <div class="page-head">
      <div>
        <div class="eyebrow" id="pageEyebrow"></div>
        <h2 id="pageTitle"></h2>
        <p class="muted" id="pageSubtitle"></p>
      </div>
      <button class="btn accent" id="newBtn"></button>
    </div>

    <div class="card" id="formPanel" style="display:none;padding:22px;margin-bottom:20px">
      <div class="section-title" id="formTitle"></div>
      <div id="formFields"></div>
      <div style="display:flex;gap:10px">
        <button class="btn primary" id="saveFormBtn">Save</button>
        <button class="btn ghost" id="cancelFormBtn">Cancel</button>
      </div>
    </div>

    <div class="table-card">
      <div class="table-toolbar"><div class="muted mini" id="rowCount"></div></div>
      <table class="data-table">
        <thead><tr id="theadRow"></tr></thead>
        <tbody id="rows"><tr><td colspan="8"><div class="skeleton-line" style="width:100%"></div></td></tr></tbody>
      </table>
      <div id="emptyState" class="empty-state" style="display:none"><h3>Nothing here yet</h3><p>Create the first one above.</p></div>
    </div>

  </main>
</div>
<script src="../shared/js/config.js"></script>
<script src="../shared/js/api.js"></script>
<script src="../shared/js/admin-crud.js"></script>
<script>

renderCrudPage({
  navKey: "automations",
  eyebrow: "Communication \u00b7 automations",
  title: "Automations",
  subtitle: "Every automation is a row here and can be enabled, disabled or edited without a deploy. Throttles are enforced server-side.",
  listPath: "/v1/admin/automations",
  createLabel: "+ New automation",
  toggleField: "is_active",
  columns: [
    { label: "Trigger", render: a => `<span class="cell-primary">${escapeHtml(fieldFirst(a,["trigger_type","trigger"],"\u2014"))}</span>` },
    { label: "Action", render: a => escapeHtml(fieldFirst(a,["action"],"\u2014")) },
    { label: "Throttle", render: a => escapeHtml(fieldFirst(a,["throttle_key"],"\u2014")) },
    { label: "Conditions", render: a => `<span class="cell-sub">${escapeHtml(typeof a.conditions === 'object' ? JSON.stringify(a.conditions) : (a.conditions||''))}</span>` }
  ],
  fields: [
    { key: "name", label: "Name", type: "text", placeholder: "mw.ends_in_90d" },
    { key: "trigger_type", label: "Trigger", type: "text", placeholder: "mw.ends_in_90d" },
    { key: "conditions", label: "Conditions (JSON)", type: "textarea", json: true, placeholder: '{ "eligible": true, "consent_marketing": true }' },
    { key: "action", label: "Action", type: "text", placeholder: "send ew_offer_90d (marketing)" },
    { key: "throttle_key", label: "Throttle", type: "text", placeholder: "1 per product" },
    { key: "is_active", label: "Active", type: "checkbox", default: true }
  ]
});

</script>
</body>
</html>
