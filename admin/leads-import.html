<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lead import - HomeKeep</title><link rel="stylesheet" href="../shared/css/admin.css"></head>
<body data-area="admin"><div class="app"><aside id="sidebar"></aside><main class="content">
<div id="importError" class="api-error-banner" role="alert"></div>
<div class="page-head"><div><div class="eyebrow">Data · lead intake</div><h2>Lead import</h2><p class="muted">CSV/XLSX upload with source-specific billing configuration and rejection reporting.</p></div></div>
<div class="card" style="padding:24px;margin-bottom:20px"><div class="form-row"><label>Lead source<select id="source"><option value="">Loading…</option></select></label><label>File<input type="file" id="file" accept=".csv,.xlsx,.xls"></label></div><button class="btn primary" id="importBtn">Start import</button></div>
<div id="progress" class="card" style="padding:20px;display:none;margin-bottom:20px"><div class="section-title">Import status</div><div id="statusText" class="muted">Queued…</div><div class="stats" style="margin-top:15px"><div class="stat stat-card"><span class="stat-label">Rows</span><span class="stat-value" id="rows">—</span></div><div class="stat stat-card"><span class="stat-label">Accepted</span><span class="stat-value" id="accepted">—</span></div><div class="stat stat-card alert"><span class="stat-label">Rejected</span><span class="stat-value" id="rejected">—</span></div></div></div>
<div id="rejectionSection" class="table-card" style="display:none"><div class="table-toolbar"><div class="section-title" style="margin:0">Rejection report</div></div><table class="data-table"><thead><tr><th>Row</th><th>Data</th><th>Reason</th></tr></thead><tbody id="rejections"></tbody></table></div>
</main></div>
<script src="../shared/js/config.js"></script><script src="../shared/js/api.js"></script>
<script>
renderSidebar("leads-import");const $=id=>document.getElementById(id);let timer=null;
async function loadSources(){try{let d=await authFetch("/v1/admin/lead-sources?page=1&limit=100&status=active",{method:"GET"});let items=Array.isArray(d)?d:(d.items||d.data||[]);$("source").innerHTML='<option value="">Select source…</option>'+items.map(s=>`<option value="${escapeHtml(s.id||s._id)}">${escapeHtml(s.name||s.code)}</option>`).join("")}catch(e){showBanner("importError",e.message||"Unable to load lead sources.")}}
function updateStatus(d){d=d||{};$("statusText").textContent=(d.status||"unknown")+" · "+(d.message||"");$("rows").textContent=d.rows??d.total_rows??d.processed??"—";$("accepted").textContent=d.accepted??d.successful??"—";$("rejected").textContent=d.rejected??d.failed??"—";const rej=d.rejection_report||d.rejections||[];if(rej.length){$("rejectionSection").style.display="block";$("rejections").innerHTML=rej.map((r,i)=>`<tr><td>${i+1}</td><td class="cell-sub">${escapeHtml(JSON.stringify(r.data||r.row||r))}</td><td class="cell-sub">${escapeHtml(r.reason||"Invalid row")}</td></tr>`).join("")}}
async function poll(id){clearTimeout(timer);try{const d=await authFetch("/v1/admin/lead-imports/imports/"+encodeURIComponent(id),{method:"GET"});updateStatus(d);if(["completed","failed","rejected"].includes(String(d.status).toLowerCase())){toast(d.status==="completed"?"Import completed.":"Import finished.");return}timer=setTimeout(()=>poll(id),1500)}catch(e){showBanner("importError",e.message||"Unable to read import status.")}}
$("importBtn").onclick=async()=>{hideBanner("importError");const source=$("source").value,file=$("file").files[0];if(!source||!file){toast("Select a source and file.","err");return}const b=$("importBtn");b.disabled=true;b.textContent="Uploading…";try{const fd=new FormData();fd.append("file",file);const res=await fetch(API_BASE_URL+"/v1/admin/lead-imports/"+encodeURIComponent(source),{method:"POST",headers:{Authorization:"Bearer "+getAccessToken(),Accept:"application/json"},body:fd});let body=await res.json().catch(()=>null);if(!res.ok)throw new Error(body?.error?.message||"Import failed.");const d=body?.data||body;$("progress").style.display="block";updateStatus(d);poll(d.import_id)}catch(e){showBanner("importError",e.message||"Import failed.")}finally{b.disabled=false;b.textContent="Start import"}};loadSources();
</script></body></html>
