<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings - HomeKeep</title><link rel="stylesheet" href="../shared/css/admin.css"></head>
<body data-area="admin"><div class="app"><aside id="sidebar"></aside><main class="content" style="max-width:760px">
<div id="pageError" class="api-error-banner" role="alert"></div><div class="page-head"><div><div class="eyebrow">System</div><h2>Settings</h2><p class="muted">Current staff account and effective permissions.</p></div></div>
<div class="card" style="padding:22px"><div id="profile">Loading…</div></div><button class="btn danger" style="margin-top:20px" id="logoutBtn">Sign out of HomeKeep</button>
</main></div><script src="../shared/js/config.js"></script><script src="../shared/js/api.js"></script><script>
renderSidebar("settings");const $=id=>document.getElementById(id);
async function load(){try{const d=await authFetch("/v1/admin/me",{method:"GET"});$("profile").innerHTML=`<div class="kv-row"><span class="muted">Name</span><strong>${escapeHtml(d.name||"—")}</strong></div><div class="kv-row"><span class="muted">Email</span><strong>${escapeHtml(d.email||"—")}</strong></div><div class="kv-row"><span class="muted">Role</span><strong>${escapeHtml(d.role||"—")}</strong></div><div class="kv-row"><span class="muted">MFA</span><strong>${d.mfa_enabled?"Enabled":"Not enabled"}</strong></div><div class="kv-row"><span class="muted">Permissions</span><span>${escapeHtml((d.permissions||[]).join(", ")||"—")}</span></div>`}catch(e){showBanner("pageError",e.message||"Unable to load account settings.")}}$("logoutBtn").onclick=logout;load();
</script></body></html>
